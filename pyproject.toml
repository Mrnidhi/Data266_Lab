[build-system]
requires = ["setuptools>=77,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "data266-lab1-2342"
version = "0.1.0"
description = "Independent DATA266 Lab 1 training and rehearsal package"
requires-python = ">=3.12"
dependencies = [
  "torch==2.11.0", "torchvision==0.26.0", "numpy>=1.26", "pandas>=2.2",
  "scikit-learn>=1.5", "scipy==1.16.3", "matplotlib>=3.9",
  "datasets>=3", "Pillow>=10", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6"
]

[project.optional-dependencies]
test = ["pytest>=8"]
image-metrics = ["clean-fid>=0.1.35", "lpips>=0.1.4", "prdc>=0.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
